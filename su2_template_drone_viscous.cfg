%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file - supersonic_drone.csm, viscous RANS (SA model)      %
% Viscous counterpart of su2_template.cfg (the inviscid drone template),      %
% built from su2_template_wing_viscous.cfg. __PLACEHOLDERS__ are substituted  %
% per-run/per-case - see write_su2_config() in aflr_mesh_drone.py.            %
%                                                                              %
% MARKER_* names match the drone's capsGroups (Aircraft, Farfield, symmetry,  %
% EngineFace). Without the inlet, remove EngineFace from every MARKER_* line.  %
% Pair this with --bl (AFLR3 boundary-layer mesh): a wall-resolved RANS run   %
% needs the prism layers.                                                      %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= RANS
%
KIND_TURB_MODEL= SA
%
MATH_PROBLEM= DIRECT
%
RESTART_SOL= NO

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
%
MACH_NUMBER= __MACH_NUMBER__
%
AOA= __AOA__
%
SIDESLIP_ANGLE= 0.0
%
INIT_OPTION= REYNOLDS
%
FREESTREAM_OPTION= TEMPERATURE_FS
%
% standard atmosphere at 20,000 ft (with INIT_OPTION= REYNOLDS this sets the
% viscosity/speed of sound; REYNOLDS_NUMBER must be computed at the same altitude)
FREESTREAM_TEMPERATURE= 248.53
%
REYNOLDS_NUMBER= __REYNOLDS_NUMBER__
%
% Reynolds length - same reference length as REF_LENGTH below (wing:MAC)
REYNOLDS_LENGTH= __REF_LENGTH__

% ---- IDEAL GAS, POLYTROPIC, VAN DER WAALS AND PENG ROBINSON CONSTANTS -------%
%
FLUID_MODEL= STANDARD_AIR
%
GAMMA_VALUE= 1.4
%
GAS_CONSTANT= 287.058

% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= SUTHERLAND
%
MU_REF= 1.716E-5
%
MU_T_REF= 273.15
%
SUTHERLAND_CONSTANT= 110.4

% --------------------------- THERMAL CONDUCTIVITY MODEL ----------------------%
%
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
%
PRANDTL_LAM= 0.72
%
PRANDTL_TURB= 0.90

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
% moment reference = MAC quarter chord, substituted from the .csm's wing:xRef
% OUTPMTR (z = 0: the fuselage axis). The final ROTATEX 90 to SU2 axes
% leaves x unchanged, so the build-frame xRef applies directly.
REF_ORIGIN_MOMENT_X = __MOMENT_X__
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
%
% Reference length for pitching, rolling, and yawing non-dimensional moment -
% substituted from the .csm's own wing:MAC OUTPMTR, not a placeholder 1.0
REF_LENGTH= __REF_LENGTH__
%
% Reference area for force coefficients - substituted from wing:refArea,
% NOT left as 0/automatic (automatic calc can be unreliable on complex bodies)
REF_AREA= __REF_AREA__
%
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
% capsGroup names here MUST match what's actually tagged in the .su2 mesh
% (after marker renaming). Adiabatic no-slip wall: ( marker, heat flux ) pairs
MARKER_HEATFLUX= ( Aircraft, 0.0 )
%
MARKER_FAR= ( Farfield )
%
MARKER_SYM= ( symmetry )
%
% Engine face (inlet geometry only): the duct's outflow into the engine.
% SU2 adjusts the static pressure here until the face-averaged Mach number
% matches the target; ~0.4-0.6 is typical for a subsonic diffuser exit.
ENGINE_INFLOW_TYPE= FAN_FACE_MACH
MARKER_ENGINE_INFLOW= ( EngineFace, 0.5 )
%
MARKER_PLOTTING= ( Aircraft, EngineFace )
%
MARKER_MONITORING= ( Aircraft, EngineFace )

% ------------- COMMON PARAMETERS TO DEFINE THE NUMERICAL METHOD --------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
%
OBJECTIVE_FUNCTION= DRAG
%
% start low and ramp slowly - with y+~1 prism layers (aspect ratios in the
% thousands) the old ramp (x1.5/iter up to CFL 100) diverged the 20 deg case
% at iter ~150. ( factor down, factor up, min CFL, max CFL )
CFL_NUMBER= 1.0
%
CFL_ADAPT= YES
%
CFL_ADAPT_PARAM= ( 0.5, 1.05, 0.5, 20.0 )
%
ITER= __MAX_ITER__
%
LINEAR_SOLVER= FGMRES
%
LINEAR_SOLVER_PREC= ILU
%
LINEAR_SOLVER_ERROR= 1E-6
%
LINEAR_SOLVER_ITER= 10

% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
% multigrid off: agglomeration on high-aspect-ratio prism layers plus shocks
% tends to destabilize supersonic RANS runs
MGLEVEL= 0

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
% upwind + limiter instead of JST (the inviscid template's scheme) - more
% robust through the shocks at supersonic Mach numbers
CONV_NUM_METHOD_FLOW= ROE
%
MUSCL_FLOW= YES
%
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
%
VENKAT_LIMITER_COEFF= 0.05
%
ENTROPY_FIX_COEFF= 0.001
%
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
%
MUSCL_TURB= NO
%
SLOPE_LIMITER_TURB= VENKATAKRISHNAN
%
TIME_DISCRE_TURB= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
% stop only when BOTH lift and drag have settled. DRAG alone at 1E-4 over
% 100 iters stopped the 20 deg case at iter 153 with residuals down only
% ~1.6 orders - the separated/vortex flow had not developed yet. STARTITER
% keeps the Cauchy check from firing during the startup transient.
CONV_FIELD= (LIFT, DRAG)
%
CONV_RESIDUAL_MINVAL= -10
%
CONV_STARTITER= 500
%
CONV_CAUCHY_ELEMS= 200
%
CONV_CAUCHY_EPS= 1E-5

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= __MESH_FILENAME__
%
MESH_FORMAT= SU2
%
MESH_OUT_FILENAME= mesh_out.su2
%
SOLUTION_FILENAME= solution_flow
%
SOLUTION_ADJ_FILENAME= solution_adj
%
TABULAR_FORMAT= CSV
%
% MUST stay "history" - get_last_row_coeffs, save_convergence_plot and
% mesh_gui.py's live convergence tab all look for history.csv specifically
CONV_FILENAME= history
%
RESTART_FILENAME= restart_flow
%
RESTART_ADJ_FILENAME= restart_adj
%
VOLUME_FILENAME= flow
%
VOLUME_ADJ_FILENAME= adjoint
%
GRAD_OBJFUNC_FILENAME= of_grad.dat
%
SURFACE_FILENAME= surface_flow
%
SURFACE_ADJ_FILENAME= surface_adjoint
%
OUTPUT_WRT_FREQ= 100
%
SCREEN_OUTPUT= (INNER_ITER, WALL_TIME, RMS_RES, AERO_COEFF)
%
HISTORY_OUTPUT= (INNER_ITER, WALL_TIME, RMS_RES, AERO_COEFF)
