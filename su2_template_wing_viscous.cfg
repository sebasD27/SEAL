%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file - testWing.csm, viscous RANS (SA turbulence model)   %
% Adapted from VisTestWing (1).cfg (itself the SU2 ONERA M6 RANS tutorial,    %
% Thomas D. Economon, Stanford Univ., 2014.06.14). __PLACEHOLDERS__ are       %
% substituted per-run/per-case, same convention as su2_template.cfg (the      %
% inviscid drone template) - see write_su2_config() in aflr_mesh_drone.py.    %
%                                                                              %
% ONLY for the Test Wing case: MARKER_* names below match the wing's         %
% capsGroups (upperFace, lowerFace, tail, tip, Farfield, symmetry) - NOT      %
% the drone's ("Aircraft"). Pair this with --bl (AFLR3 boundary-layer mesh)   %
% since a RANS wall-resolved run needs the prism layers.                      %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= RANS
%
KIND_TURB_MODEL= SA
%
MATH_PROBLEM= DIRECT
%
RESTART_SOL= NO

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
%
MACH_NUMBER= __MACH_NUMBER__
%
AOA= __AOA__
%
SIDESLIP_ANGLE= 0.0
%
INIT_OPTION= REYNOLDS
%
FREESTREAM_OPTION= TEMPERATURE_FS
%
FREESTREAM_TEMPERATURE= 288.15
%
REYNOLDS_NUMBER= __REYNOLDS_NUMBER__
%
% Reynolds length - same reference length as REF_LENGTH below (wing:MAC)
REYNOLDS_LENGTH= __REF_LENGTH__

% ---- IDEAL GAS, POLYTROPIC, VAN DER WAALS AND PENG ROBINSON CONSTANTS -------%
%
FLUID_MODEL= STANDARD_AIR
%
GAMMA_VALUE= 1.4
%
GAS_CONSTANT= 287.058

% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= SUTHERLAND
%
MU_REF= 1.716E-5
%
MU_T_REF= 273.15
%
SUTHERLAND_CONSTANT= 110.4

% --------------------------- THERMAL CONDUCTIVITY MODEL ----------------------%
%
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
%
PRANDTL_LAM= 0.72
%
PRANDTL_TURB= 0.90

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
%
% Reference length for pitching, rolling, and yawing non-dimensional moment -
% substituted from the .csm's own wing:MAC OUTPMTR, not a placeholder 1.0
REF_LENGTH= __REF_LENGTH__
%
% Reference area for force coefficients - substituted from wing:refArea,
% NOT left as 0/automatic (automatic calc can be unreliable on complex bodies)
REF_AREA= __REF_AREA__
%
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
% capsGroup names here MUST match what's actually tagged in the .su2 mesh
% (after marker renaming) - "tail" included alongside upperFace/lowerFace/tip
% since it's a real (if small) solid surface on this wing, unlike the plain
% ONERA M6 tutorial mesh this file was adapted from
MARKER_HEATFLUX= ( upperFace, lowerFace, tail, tip )
%
MARKER_FAR= ( Farfield )
%
MARKER_SYM= ( symmetry )
%
MARKER_PLOTTING= ( upperFace, lowerFace, tail, tip )
%
MARKER_MONITORING= ( upperFace, lowerFace, tail, tip )

% ------------- COMMON PARAMETERS TO DEFINE THE NUMERICAL METHOD --------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
%
CFL_NUMBER= 100.0
%
CFL_ADAPT= NO
%
CFL_ADAPT_PARAM= ( 1.5, 0.5, 25.0, 100000.0 )
%
RK_ALPHA_COEFF= ( 0.66667, 0.66667, 1.000000 )
%
ITER= __MAX_ITER__
%
LINEAR_SOLVER= FGMRES
%
LINEAR_SOLVER_PREC= ILU
%
LINEAR_SOLVER_ERROR= 1E-10
%
LINEAR_SOLVER_ITER= 10

% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 3
%
MGCYCLE= W_CYCLE
%
MG_PRE_SMOOTH= ( 1, 1, 1, 1 )
%
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
%
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
%
MG_DAMP_RESTRICTION= 0.7
%
MG_DAMP_PROLONGATION= 0.7

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= JST
%
JST_SENSOR_COEFF= ( 0.5, 0.02 )
%
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
%
MUSCL_TURB= NO
%
SLOPE_LIMITER_TURB= VENKATAKRISHNAN
%
TIME_DISCRE_TURB= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD= DRAG
%
CONV_STARTITER= 10
%
CONV_CAUCHY_ELEMS= 100
%
CONV_CAUCHY_EPS= 1E-6

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= __MESH_FILENAME__
%
MESH_FORMAT= SU2
%
MESH_OUT_FILENAME= mesh_out.su2
%
SOLUTION_FILENAME= solution_flow
%
SOLUTION_ADJ_FILENAME= solution_adj
%
TABULAR_FORMAT= CSV
%
% MUST stay "history" (not "History2" as in the tutorial this was adapted
% from) - the rest of the pipeline (get_last_row_coeffs, save_convergence_plot,
% mesh_gui.py's live convergence tab) all look for history.csv specifically
CONV_FILENAME= history
%
RESTART_FILENAME= restart_flow
%
RESTART_ADJ_FILENAME= restart_adj
%
VOLUME_FILENAME= flow
%
VOLUME_ADJ_FILENAME= adjoint
%
GRAD_OBJFUNC_FILENAME= of_grad.dat
%
SURFACE_FILENAME= surface_flow
%
SURFACE_ADJ_FILENAME= surface_adjoint
%
OUTPUT_WRT_FREQ= 100
%
SCREEN_OUTPUT= (INNER_ITER, WALL_TIME, RMS_RES, AERO_COEFF)
%
HISTORY_OUTPUT= (INNER_ITER, WALL_TIME, RMS_RES, AERO_COEFF)
