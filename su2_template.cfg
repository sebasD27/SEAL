%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file - supersonic_drone.csm, inviscid Euler               %
% Adapted from invDroneCFD.cfg (itself adapted from the SU2 ONERA M6          %
% inviscid tutorial). __PLACEHOLDERS__ are substituted per-run/per-case.      %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
% use EULER, RANS, INC_EULER, INC_RANS
SOLVER= EULER
%
MATH_PROBLEM= DIRECT
%
RESTART_SOL= NO

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
%
MACH_NUMBER= __MACH_NUMBER__
%
AOA= __AOA__
%
SIDESLIP_ANGLE= 0.0
%
FREESTREAM_PRESSURE= 101325.0
%
FREESTREAM_TEMPERATURE= 288.15

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
% moment reference = MAC quarter chord, substituted from the .csm's wing:xRef
% OUTPMTR (z = 0: the fuselage axis). The final ROTATEX 90 to SU2 axes
% leaves x unchanged, so the build-frame xRef applies directly.
REF_ORIGIN_MOMENT_X = __MOMENT_X__
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
%
% Reference length for pitching, rolling, and yawing non-dimensional moment -
% substituted from the .csm's own wing:MAC OUTPMTR, not a placeholder 1.0
REF_LENGTH= __REF_LENGTH__
%
% Reference area for force coefficients - substituted from wing:refArea,
% NOT left as 0/automatic (automatic calc can be unreliable on complex bodies)
REF_AREA= __REF_AREA__
%
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
%
% capsGroup names here MUST match what's actually tagged in the .su2 mesh
% (after marker renaming)
MARKER_EULER= ( Aircraft )
%
MARKER_FAR= ( Farfield )
%
MARKER_SYM= ( symmetry )
%
MARKER_PLOTTING= ( Aircraft )
%
MARKER_MONITORING= ( Aircraft )

% ------------- COMMON PARAMETERS TO DEFINE THE NUMERICAL METHOD --------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
%
OBJECTIVE_FUNCTION= DRAG
%
CFL_NUMBER= 25.0
%
CFL_ADAPT= YES
%
CFL_ADAPT_PARAM= ( 0.1, 2.0, 25.0, 1e10 )
%
RK_ALPHA_COEFF= ( 0.66667, 0.66667, 1.000000 )
%
ITER= __MAX_ITER__
%
LINEAR_SOLVER= FGMRES
%
LINEAR_SOLVER_PREC= ILU
%
LINEAR_SOLVER_ERROR= 1E-6
%
LINEAR_SOLVER_ITER= 10

% ----------------------- SLOPE LIMITER DEFINITION ----------------------------%
%
VENKAT_LIMITER_COEFF= 0.03
%
ADJ_SHARP_LIMITER_COEFF= 3.0
%
REF_SHARP_EDGES= 3.0
%
SENS_REMOVE_SHARP= YES

% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 3
%
MGCYCLE= W_CYCLE
%
MG_PRE_SMOOTH= ( 1, 2, 3, 3 )
%
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
%
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
%
MG_DAMP_RESTRICTION= 0.9
%
MG_DAMP_PROLONGATION= 0.9

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= JST
%
JST_SENSOR_COEFF= ( 0.5, 0.02 )
%
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD= RMS_DENSITY
%
CONV_RESIDUAL_MINVAL= -12
%
CONV_STARTITER= 25
%
CONV_CAUCHY_ELEMS= 100
%
CONV_CAUCHY_EPS= 1E-10

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= __MESH_FILENAME__
%
MESH_OUT_FILENAME= mesh_out.su2
%
SOLUTION_FILENAME= solution_flow
%
SOLUTION_ADJ_FILENAME= solution_adj
%
MESH_FORMAT= SU2
%
TABULAR_FORMAT= CSV
%
CONV_FILENAME= history
%
RESTART_FILENAME= restart_flow
%
RESTART_ADJ_FILENAME= restart_adj
%
VOLUME_FILENAME= flow
%
VOLUME_ADJ_FILENAME= adjoint
%
GRAD_OBJFUNC_FILENAME= of_grad.dat
%
SURFACE_FILENAME= surface_flow
%
SURFACE_ADJ_FILENAME= surface_adjoint
%
OUTPUT_WRT_FREQ= 100
%
SCREEN_OUTPUT= (INNER_ITER, WALL_TIME, RMS_RES, AERO_COEFF)
%
HISTORY_OUTPUT= (INNER_ITER, WALL_TIME, RMS_RES, AERO_COEFF)
